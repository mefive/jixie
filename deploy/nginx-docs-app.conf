# The documentation is an independent Vite application mounted at /docs.
location = /docs {
    return 302 /docs/help;
}

location ^~ /docs/ {
    root /opt/jixie/apps/docs/dist;
    try_files $uri $uri/ /docs/index.html;
}

# Preserve old public URLs while making /docs/help the canonical manual path.
location = /help {
    return 301 /docs/help;
}

location /help/ {
    return 301 /docs$request_uri;
}

location = /learn {
    return 302 /docs/help;
}
